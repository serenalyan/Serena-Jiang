function resize(){
const r=host.getBoundingClientRect();W=Math.max(1,Math.round(r.width));H=Math.max(1,Math.round(r.height));
const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
ctx.setTransform(dpr,0,0,dpr,0,0);
if(!seeded){seeded=true;const[x0,y0,x1,y1]=o.area;
if(!rm.matches)add(W*(x0+(x1-x0)*.68),H*(y0+(y1-y0)*.34),performance.now()-500)}
draw(performance.now())}
function idle(d){clearTimeout(timer);timer=setTimeout(()=>tick(performance.now()),Math.max(16,d))}
function tick(now){
raf=0;if(!vis||document.hidden)return;
if(rm.matches){rings=[];draw(now);return}
if(now>=next){const[x0,y0,x1,y1]=o.area;add(W*(x0+Math.random()*(x1-x0)),H*(y0+Math.random()*(y1-y0)),now);next=now+o.every*1000}
draw(now);
if(rings.length)raf=requestAnimationFrame(tick);else idle(next-now)}
function wake(){if(!raf){clearTimeout(timer);raf=requestAnimationFrame(tick)}}
host.addEventListener("pointerdown",e=>{if(rm.matches)return;const r=host.getBoundingClientRect();add(e.clientX-r.left,e.clientY-r.top,performance.now());wake()});
new ResizeObserver(resize).observe(host);
new IntersectionObserver(([en])=>{vis=en?en.isIntersecting:true;if(vis)wake()}).observe(host);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)wake()});
rm.addEventListener("change",wake);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{readColor();wake()});
readColor();resize();wake()})();
</script>
</body>
</html>
